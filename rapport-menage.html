<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://lvfncstosaaqgtfozthw.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Rapport ménage · Maison Jayla</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F5EFE7;--surface:#FBF8F3;--line:#E3D9CE;--fg:#30282A;--muted:#6E6266;--accent:#542C35;--gold:#9A7A4C;--ok:#2F6B4A;--ok-bg:#E3F0E8;--bad:#9B2F2F;--bad-bg:#F6E3E3;
  --f-d:"Cormorant Garamond",Georgia,serif;--f-b:"Manrope","Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-b);padding-bottom:env(safe-area-inset-bottom,0)}
#contenu{display:flex;flex-direction:column;gap:16px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:16px}
header{border-bottom:1px solid var(--gold);padding-bottom:12px}
.brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font:600 30px/1.1 var(--f-d);color:var(--accent);margin:4px 0 0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font:600 22px/1.15 var(--f-d);color:var(--accent);margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.count{font:700 12px var(--f-b);color:var(--muted)}
.count.ok{color:var(--ok)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:flex;flex-direction:column;gap:6px}
.slot b{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:4px;min-height:4px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.thumbs .wait{width:56px;height:56px;border-radius:4px;background:var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.thumbs .ko{background:var(--bad-bg);color:var(--bad)}
label.btn,button.btn{font:700 14px var(--f-b);border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:8px;padding:11px 12px;text-align:center;cursor:pointer;display:block;width:100%;min-height:44px}
button.btn.primary{background:var(--accent);color:#FBF8F3}
button.btn[disabled]{opacity:.5}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
input[type=text],select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);min-height:44px}
textarea{min-height:70px;resize:vertical}
.fl{font-size:13px;font-weight:700}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding-left:10px;margin:0;white-space:pre-wrap}
.sig{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.msg{padding:14px;border-radius:8px;font-size:15px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0))}
.bar .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.bar small{color:var(--muted);text-align:center}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="brand">Maison Jayla · rapport de ménage</div>
    <h1 id="titre">Chargement…</h1>
    <p class="sub" id="sous"></p>
  </header>
  <div id="contenu"></div>
</div>
<div class="bar" id="bar" hidden><div class="in">
  <button class="btn primary" id="envoyer" type="button">Envoyer le rapport</button>
  <small id="etat"></small>
</div></div>

<script>
(function(){
  const FONCTION = 'https://lvfncstosaaqgtfozthw.supabase.co/functions/v1/rapport-menage';
  const SUPABASE_URL = 'https://lvfncstosaaqgtfozthw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_UrB6X04fyAOhnN7aHropFQ_mwubBip2';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const jeton = new URLSearchParams(location.hash.slice(1)).get('t') || '';
  // Le jeton reste dans le fragment (#) : il n'est jamais envoyé au serveur web ni dans un en-tête Referer.
  const TYPES = { casse:'Casse ou dégât', linge:'Linge manquant ou abîmé', consommables:'Consommables à racheter', objet_oublie:'Objet oublié par le voyageur', autre:'Autre' };
  let info = null, enCours = 0, nSig = 0;
  const compte = {};   // "piece|moment" -> nombre de photos envoyées

  async function appel(action, corps) {
    const r = await fetch(FONCTION, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: SUPABASE_KEY },
      body: JSON.stringify({ action, jeton, ...corps }) });
    let d = {}; try { d = await r.json(); } catch(_) {}
    if (!r.ok) throw new Error(d.erreur || 'Connexion impossible. Vérifie le réseau et réessaie.');
    return d;
  }
  function erreur(t) { $('titre').textContent = 'Rapport indisponible'; $('contenu').innerHTML = `<div class="msg err">${esc(t)}</div>`; $('bar').hidden = true; }

  // Réduit la photo dans le téléphone : 1600 px max, JPEG, ~250 Ko.
  async function reduire(fichier) {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('Photo illisible.')); i.src = URL.createObjectURL(fichier); });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    let q = 0.75, b;
    do { b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q)); q -= 0.1; } while (b && b.size > 400000 && q > 0.35);
    if (!b) throw new Error('Photo illisible.');
    return b;
  }

  async function envoyerPhoto(fichier, piece, moment, zone) {
    const vignette = document.createElement('span'); vignette.className = 'wait'; vignette.textContent = '…'; zone.appendChild(vignette);
    enCours++; majBarre();
    try {
      const blob = await reduire(fichier);
      const { chemin, jeton_envoi } = await appel('televerser', { piece, moment, taille: blob.size });
      const { error } = await sb.storage.from('rapports-menage').uploadToSignedUrl(chemin, jeton_envoi, blob, { contentType: 'image/jpeg' });
      if (error) throw new Error("L'envoi de la photo a échoué.");
      const img = document.createElement('img'); img.alt = `${piece}, ${moment}`; img.src = URL.createObjectURL(blob);
      vignette.replaceWith(img);
      compte[piece + '|' + moment] = (compte[piece + '|' + moment] || 0) + 1;
      return chemin;
    } catch (e) {
      vignette.className = 'wait ko'; vignette.textContent = '✕'; vignette.title = e.message;
      alert(e.message); return null;
    } finally { enCours--; majBarre(); majCompteurs(); }
  }

  function majCompteurs() {
    (info?.pieces || []).forEach((p, i) => {
      const a = compte[p + '|avant'] || 0, b = compte[p + '|apres'] || 0, el = $('c' + i);
      if (el) { el.textContent = `${a} avant · ${b} après`; el.className = 'count' + (b ? ' ok' : ''); }
    });
  }
  function majBarre() {
    const sansApres = (info?.pieces || []).filter(p => !compte[p + '|apres']).length;
    $('envoyer').disabled = enCours > 0;
    $('etat').textContent = enCours ? `Envoi de ${enCours} photo(s) en cours…`
      : sansApres ? `${sansApres} pièce(s) sans photo « après ».` : 'Toutes les pièces ont leur photo « après ».';
  }

  function champPhoto(piece, moment, i) {
    const id = `f-${moment}-${i}`;
    return `<div class="slot"><b>${moment === 'avant' ? 'Avant' : 'Après'}</b><div class="thumbs" id="t-${moment}-${i}"></div>
      <label class="btn" for="${id}">📷 Photo</label><input type="file" id="${id}" accept="image/*" capture="environment" multiple data-piece="${esc(piece)}" data-moment="${moment}" data-zone="t-${moment}-${i}"></div>`;
  }
  function blocSignalement() {
    const n = nSig++;
    const opts = Object.entries(TYPES).map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
    const pieces = (info.pieces || []).map(p => `<option>${esc(p)}</option>`).join('');
    const d = document.createElement('div'); d.className = 'sig'; d.dataset.sig = n;
    d.innerHTML = `<select aria-label="Type de problème" data-k="type">${opts}</select>
      <select aria-label="Pièce" data-k="piece"><option value="">Pièce (facultatif)</option>${pieces}</select>
      <textarea data-k="texte" placeholder="En une phrase : ce que tu as constaté" aria-label="Description du problème"></textarea>
      <div class="thumbs" id="ts-${n}"></div>
      <label class="btn" for="fs-${n}">📷 Photo du problème</label><input type="file" id="fs-${n}" accept="image/*" capture="environment" data-sigphoto="${n}">`;
    $('sigs').appendChild(d);
  }

  function afficher() {
    $('titre').textContent = info.bien;
    const dt = info.date ? new Date(info.date + 'T12:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }) : '';
    $('sous').textContent = [dt, info.heure].filter(Boolean).join(' · ');
    (info.photos || []).forEach(p => { compte[p.piece + '|' + p.moment] = (compte[p.piece + '|' + p.moment] || 0) + 1; });
    $('contenu').innerHTML = `
      ${info.consignes ? `<p class="note">${esc(info.consignes)}</p>` : ''}
      <p class="note">Pour chaque pièce : une ou plusieurs photos avant le ménage, puis après. Les photos partent au fur et à mesure.</p>
      ${info.pieces.map((p, i) => `<section class="card"><h2>${esc(p)} <span class="count" id="c${i}"></span></h2>
        <div class="duo">${champPhoto(p, 'avant', i)}${champPhoto(p, 'apres', i)}</div></section>`).join('')}
      <section class="card"><h2>Un problème ?</h2>
        <p class="note">Casse, linge manquant, consommables à racheter, objet oublié : une photo et une phrase.</p>
        <div id="sigs"></div>
        <button class="btn" type="button" id="ajSig">+ Signaler un problème</button></section>
      <section class="card"><h2>Pour finir</h2>
        <div><label class="fl" for="nom">Ton prénom et nom</label><input type="text" id="nom" autocomplete="name" maxlength="80"></div>
        <div><label class="fl" for="com">Un mot pour la co-hôte (facultatif)</label><textarea id="com" maxlength="1000"></textarea></div></section>`;
    $('bar').hidden = false; majCompteurs(); majBarre();
    $('ajSig').addEventListener('click', blocSignalement);
  }

  document.addEventListener('change', async e => {
    const f = e.target;
    if (!(f instanceof HTMLInputElement) || f.type !== 'file' || !f.files.length) return;
    const fichiers = [...f.files]; f.value = '';
    if (f.dataset.sigphoto != null) {
      const bloc = document.querySelector(`[data-sig="${f.dataset.sigphoto}"]`);
      const chemin = await envoyerPhoto(fichiers[0], bloc.querySelector('[data-k=piece]').value || 'Signalement', 'signalement', $('ts-' + f.dataset.sigphoto));
      if (chemin) bloc.dataset.photo = chemin;
      return;
    }
    for (const x of fichiers) await envoyerPhoto(x, f.dataset.piece, f.dataset.moment, $(f.dataset.zone));
  });

  $('envoyer').addEventListener('click', async () => {
    const nom = $('nom').value.trim();
    if (!nom) { alert('Indique ton nom avant d\'envoyer.'); $('nom').focus(); return; }
    const sansApres = info.pieces.filter(p => !compte[p + '|apres']);
    if (sansApres.length && !confirm(`Pas de photo « après » pour : ${sansApres.join(', ')}.\nEnvoyer quand même ?`)) return;
    const signalements = [...document.querySelectorAll('[data-sig]')].map(b => ({
      type: b.querySelector('[data-k=type]').value, piece: b.querySelector('[data-k=piece]').value,
      texte: b.querySelector('[data-k=texte]').value.trim(), photo: b.dataset.photo || null })).filter(s => s.texte);
    $('envoyer').disabled = true; $('etat').textContent = 'Envoi du rapport…';
    try {
      await appel('soumettre', { prestataire_nom: nom, commentaire: $('com').value.trim(), signalements });
      $('bar').hidden = true;
      $('contenu').innerHTML = `<div class="msg ok">Merci ${esc(nom)}, le rapport est envoyé. Tu peux fermer cette page.</div>`;
      scrollTo(0, 0);
    } catch (e) { alert(e.message); $('envoyer').disabled = false; majBarre(); }
  });

  if (!jeton) { erreur('Lien incomplet. Ouvre le lien reçu par message, en entier.'); return; }
  appel('ouvrir').then(d => {
    info = d;
    if (['soumis', 'valide'].includes(d.statut)) {
      $('titre').textContent = d.bien;
      $('contenu').innerHTML = '<div class="msg ok">Le rapport de ce ménage a déjà été envoyé. Merci !</div>';
      return;
    }
    afficher();
  }).catch(e => erreur(e.message));
})();
</script>
</body>
</html>
